aid: peel-therapeutics
name: Peel Therapeutics
description: >-
  Peel Therapeutics is an evolutionary-medicine biotechnology company headquartered in Salt Lake City,
  Utah, with research teams in the United States and Israel. Co-founded in 2015 by pediatric oncologist
  Dr. Joshua Schiffman, the company translates molecules that evolution has already validated in nature
  into therapeutics for patients with cancer and inflammatory disease. Its founding program is built on
  elephant p53 (EP53) — elephants carry roughly forty copies of the p53 tumor-suppressor gene against the
  human two — delivered as liposomal protein nanoparticles, alongside PEEL-224, a TOP1 inhibitor in
  clinical development. Discovery runs on the company's proprietary, internal Darwin.AI platform and the
  Darwin Biobank, a comparative-oncology sample collection. Peel is a therapeutics developer rather than a
  software vendor: it publishes no developer program, no public API, and no machine-readable API contract.
